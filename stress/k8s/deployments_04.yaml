---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-80
  labels:
    label: "ordinary"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-80
  template:
    metadata:
      labels:
        app: stress-80
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
