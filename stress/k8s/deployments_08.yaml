---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-160
  labels:
    label: "ordinary"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-160
  template:
    metadata:
      labels:
        app: stress-160
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
