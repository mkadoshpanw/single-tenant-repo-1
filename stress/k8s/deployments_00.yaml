---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-0
  labels:
    label: "ordinary"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stress-0
  template:
    metadata:
      labels:
        app: stress-0
    spec:
      hostNetwork: true
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
